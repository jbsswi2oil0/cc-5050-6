<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="360" viewBox="-220 -180 440 360">
  <title>双实例 · 共享渐变与图案资源表</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c6fbb"/>
      <stop offset="0.55" stop-color="#7fb3e0"/>
      <stop offset="1" stop-color="#e8f2fb"/>
    </linearGradient>
    <pattern id="weave" data-label="织纹（共享单元）" patternUnits="userSpaceOnUse" x="-40" y="-40" width="80" height="80">
      <rect x="-40" y="-40" width="80" height="80" fill="url(#sky)"/>
      <circle cx="-16" cy="-16" r="24" fill="#d64545" fill-opacity="0.5"/>
      <circle cx="8" cy="-16" r="24" fill="#2c7fb8" fill-opacity="0.5"/>
    </pattern>
    <path id="gem" d="M0 -40 C22 -40 40 -22 40 0 C40 22 22 40 0 40 C-22 40 -40 22 -40 0 C-40 -22 -22 -40 0 -40 Z"/>
  </defs>

  <rect data-obj="duo-bg" data-label="画布底色" x="-220" y="-180" width="440" height="360" fill="#f6f1e7"/>

  <use data-obj="inst-a" data-label="实例 A（镜像 · 图案填充）" href="#gem"
       transform="translate(-110 -20) scale(-1 1)" fill="url(#weave)"/>
  <use data-obj="inst-b" data-label="实例 B（半尺寸 · 图案填充）" href="#gem"
       transform="translate(96 16) scale(0.5)" fill="url(#weave)"/>

  <rect data-obj="weave-strip" data-label="织纹长条（周期对照）" x="-220" y="40" width="440" height="80" fill="url(#weave)"/>
  <rect data-obj="sky-band" data-label="共享渐变色带（直接引用）" x="-220" y="132" width="440" height="44" fill="url(#sky)"/>

  <path data-obj="hairline" data-label="零宽参考线（诊断）" d="M190 -150 V-70"
        fill="url(#sky)" stroke="#22382f" stroke-width="2"/>
</svg>
